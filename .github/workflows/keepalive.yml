# שומר על שרת הסנכרון והטופס פעיל: התוכנית החינמית של Supabase משהה פרויקט אחרי שבוע בלי פעילות.
# פעם בשלושה ימים: פנייה קלה לשרת. פעם בחודש: רישום קטן במאגר כדי ש־GitHub לא יכבה את התזמון.
name: keep-alive
on:
  schedule:
    - cron: '17 5 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://atyvnyfadjzedcdrrwpl.supabase.co/rest/v1/rpc/form_get" \
            -H "apikey: sb_publishable_VYxvnQePn2dITBiFCyEAhA_Og_aEgPR" -H "Content-Type: application/json" -d '{"p_slug":"keepalive"}')
          echo "Supabase responded: $code"
          test "$code" = "200"
      - uses: actions/checkout@v4
      - name: Monthly heartbeat
        run: |
          month=$(date -u +%Y-%m)
          if [ "$(cat .github/heartbeat 2>/dev/null)" != "$month" ]; then
            echo "$month" > .github/heartbeat
            git config user.name "keep-alive"; git config user.email "keep-alive@users.noreply.github.com"
            git add .github/heartbeat && git commit -m "heartbeat $month" && git push
          fi
