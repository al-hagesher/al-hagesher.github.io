<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>איך היה? · על הגשר</title>
  <meta name="description" content="מאפים, מתוקים ומעבר — נשמח לשמוע איך היה">
  <meta property="og:title" content="על הגשר · איך היה?">
  <meta property="og:description" content="פחות מדקה — וכל תשובה עוזרת לנו להשתפר.">
  <meta property="og:image" content="https://al-hagesher.github.io/assets/icon.png">
  <meta name="theme-color" content="#3b2d1e">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src https://atyvnyfadjzedcdrrwpl.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/icon.png">
  <link href="css/fonts.css" rel="stylesheet">
  <style>
    :root { --brown:#3b2d1e; --brown-2:#5a4432; --brown-3:#80624a; --caramel:#a8805a; --gold:#d9a441; --sand:#ece3d5; --sand-2:#f3ece2; --cream:#faf6f0; --paper:#fffdf9; --line:#e4d9cc; --line-2:#d2c4b2; --muted:#705f4e; --bad:#a13d2d; --bad-bg:#f7e4df; --ok:#4c7445; --ok-bg:#e9f1e4; --display: Bellefair, 'Frank Ruhl Libre', serif; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Assistant, 'Arial Hebrew', Arial, sans-serif; background: var(--cream); color: #2f1d11; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--caramel); outline-offset: 2px; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
    header { text-align: center; padding: 10px 0 0; }
    header img { width: 120px; height: auto; }
    h1, h2 { font-family: var(--display); color: var(--brown); font-weight: 400; margin: 0; }
    h1 { font-size: 2rem; line-height: 1.2; text-align: center; }
    .intro { color: var(--muted); text-align: center; margin: 6px auto 0; max-width: 440px; white-space: pre-line; }
    .preview-banner { background: var(--brown); color: var(--cream); text-align: center; font-size: .85rem; font-weight: 600; padding: 6px 10px; border-radius: 10px; margin-bottom: 8px; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 14px; }
    .q { scroll-margin-top: 16px; }
    .q + .q { margin-top: 12px; }
    .q label, .q .ql { display: block; font-weight: 700; color: var(--brown); margin-bottom: 8px; font-size: 1.04rem; }
    .q .opt { color: var(--muted); font-weight: 400; font-size: .85rem; }
    .stars { display: flex; gap: 6px; justify-content: center; }
    .stars button { flex: 1; max-width: 62px; aspect-ratio: 1; border: 1px solid var(--line-2); background: #fff; border-radius: 14px; padding: 0; display: inline-flex; align-items: center; justify-content: center; transition: transform .12s, background .12s; }
    .stars button svg { width: 62%; height: 62%; fill: none; stroke: var(--line-2); stroke-width: 1.6; stroke-linejoin: round; transition: fill .12s, stroke .12s; }
    .stars button.on { background: #fff8e8; border-color: var(--gold); }
    .stars button.on svg { fill: var(--gold); stroke: #b8862e; }
    .stars button:active { transform: scale(.9); }
    .word { min-height: 1.3em; text-align: center; color: var(--brown-3); font-weight: 700; font-size: .92rem; margin-top: 6px; }
    textarea, input[type=text], input[type=tel] { width: 100%; border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 13px; background: #fff; outline: none; }
    textarea { min-height: 84px; resize: vertical; }
    textarea:focus, input:focus { border-color: var(--brown-3); box-shadow: 0 0 0 3px rgba(143,96,63,.15); }
    input[type=tel] { direction: ltr; text-align: right; }
    .bad-q .stars button, .bad-q textarea { border-color: var(--bad); }
    .ferr { color: var(--bad); font-weight: 600; font-size: .86rem; margin-top: 4px; }
    .ferr:empty { display: none; }
    .phs { display: flex; gap: 8px; flex-wrap: wrap; }
    .ph { position: relative; width: 88px; height: 88px; border-radius: 14px; overflow: hidden; background: var(--sand-2); }
    .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ph button { position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(42,30,19,.75); color: #fff; font-size: .95rem; line-height: 1; }
    .addph { width: 88px; height: 88px; border-radius: 14px; border: 1.5px dashed var(--line-2); background: #fff; color: var(--brown-3); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .8rem; font-weight: 700; cursor: pointer; }
    .addph b { font-size: 1.6rem; line-height: 1; font-weight: 400; }
    .ph .spin { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fld span { display: block; font-size: .86rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; margin-top: 12px; }
    .check input { width: 20px; height: 20px; flex: none; margin-top: 2px; accent-color: var(--brown); }
    .note { font-size: .86rem; color: var(--muted); margin: 6px 0 0; }
    .btn { width: 100%; background: var(--brown); color: var(--cream); border: 1px solid var(--brown); border-radius: 14px; padding: 14px 22px; font-weight: 700; font-size: 1.05rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; margin-top: 16px; }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.ghost { background: var(--paper); color: var(--brown); border-color: var(--line-2); }
    .err { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-weight: 600; }
    .done { text-align: center; padding: 26px 18px; }
    .done .ic { width: 68px; height: 68px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; }
    .done p { white-space: pre-line; }
    .empty { text-align: center; color: var(--muted); padding: 50px 16px; }
    .loader { width: 34px; height: 34px; border: 3px solid var(--sand); border-top-color: var(--brown); border-radius: 50%; animation: spin .9s linear infinite; margin: 60px auto; }
    .ph .loader { width: 22px; height: 22px; margin: 0; border-width: 2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 26px; }
    @media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } .stars { gap: 4px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header><img src="assets/logo-brown.png" alt="על הגשר — מאפים, מתוקים ומעבר" width="120" height="108"></header>
    <main id="app"><div class="loader" role="status" aria-label="טוען"></div></main>
  </div>
  <script src="js/feedback-form.js?v=202611131200"></script>
</body>
</html>
