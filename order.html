<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>הזמנה · על הגשר</title>
  <meta name="description" content="מאפים, מתוקים ומעבר — הזמנה אונליין">
  <meta property="og:title" content="על הגשר · הזמנה אונליין">
  <meta property="og:description" content="מאפים, מתוקים ומעבר. בחרי מה תרצי ומתי — בכמה לחיצות.">
  <meta property="og:image" content="https://hadasa055999-debug.github.io/al-hagesher/assets/icon.png">
  <meta name="theme-color" content="#4a2a16">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://hadasa055999-debug.github.io; connect-src https://atyvnyfadjzedcdrrwpl.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --brown:#4a2a16; --brown-2:#6b4126; --brown-3:#8f603f; --caramel:#b8875e; --sand:#efe6db; --sand-2:#f5efe7; --cream:#faf7f2; --paper:#fffdfa; --line:#e8ded2; --line-2:#d9cbbb; --muted:#74604f; --bad:#a13d2d; --bad-bg:#f7e4df; --ok:#4c7445; --ok-bg:#e9f1e4; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Assistant, 'Arial Hebrew', Arial, sans-serif; background: var(--cream); color: #2f1d11; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 12px 16px 130px; }
    header { text-align: center; padding: 8px 0 0; }
    header img { width: 150px; mix-blend-mode: multiply; }
    h1, h2, h3 { font-family: 'Frank Ruhl Libre', serif; color: var(--brown); font-weight: 500; margin: 0; }
    h1 { font-size: 1.6rem; margin-top: 6px; } h2 { font-size: 1.3rem; margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
    h2 .n { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--brown-3); font-size: .9rem; display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .intro { text-align: center; color: var(--muted); margin: 6px auto 0; max-width: 480px; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; }
    .cat { font-size: .82rem; color: var(--brown-3); font-weight: 700; margin: 16px 2px 8px; letter-spacing: .02em; }
    .prod { display: flex; gap: 14px; padding: 14px; border-bottom: 1px solid var(--line); }
    .prod:last-child { border-bottom: 0; }
    .prod .ph { width: 86px; height: 86px; border-radius: 12px; background: var(--sand-2); flex: none; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Frank Ruhl Libre', serif; font-size: 2rem; color: var(--caramel); }
    .prod .ph img { width: 100%; height: 100%; object-fit: cover; }
    .prod .info { flex: 1; min-width: 0; }
    .prod .name { font-weight: 700; font-size: 1.05rem; }
    .prod .desc { color: var(--muted); font-size: .9rem; }
    .prod .price { color: var(--brown); font-weight: 700; margin-top: 2px; }
    .prod .price span { color: var(--muted); font-weight: 400; font-size: .85rem; }
    .alg { font-size: .75rem; color: var(--muted); }
    .opts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
    .chip { border: 1px solid var(--line-2); background: var(--paper); border-radius: 99px; padding: 5px 12px; font: inherit; font-size: .88rem; cursor: pointer; color: var(--brown-2); }
    .chip.on { background: var(--brown); border-color: var(--brown); color: var(--cream); }
    .chip:disabled { opacity: .35; cursor: default; text-decoration: line-through; }
    .chip small { display: block; font-size: .72rem; opacity: .8; }
    .step { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
    .step button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--brown-3); background: var(--paper); color: var(--brown); font-size: 1.25rem; cursor: pointer; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
    .step button.add { width: auto; border-radius: 99px; padding: 0 16px; font-size: .95rem; font-weight: 700; background: var(--brown); color: var(--cream); border-color: var(--brown); }
    .step output { min-width: 30px; text-align: center; font-weight: 700; font-size: 1.05rem; }
    .dates { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x mandatory; }
    .dates .chip { flex: none; text-align: center; padding: 8px 12px; border-radius: 12px; scroll-snap-align: start; min-width: 74px; }
    .dates .chip b { display: block; font-size: 1.05rem; }
    .times { display: flex; flex-wrap: wrap; gap: 6px; }
    label { display: block; margin-bottom: 12px; }
    label > span { display: block; font-size: .88rem; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
    input, textarea { width: 100%; font: inherit; border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 13px; background: #fff; color: inherit; outline: none; }
    input:focus, textarea:focus { border-color: var(--brown-3); box-shadow: 0 0 0 3px rgba(143,96,63,.15); }
    input[type=tel] { direction: ltr; text-align: right; }
    .seg { display: flex; background: var(--sand-2); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
    .seg button { flex: 1; border: 0; background: none; padding: 10px; border-radius: 10px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
    .seg button.on { background: var(--paper); color: var(--brown); box-shadow: 0 1px 3px rgba(74,42,22,.15); }
    .pad { padding: 16px; }
    .note { font-size: .88rem; color: var(--muted); }
    .check { display: flex; gap: 10px; align-items: flex-start; font-size: .92rem; }
    .check input { width: 20px; height: 20px; flex: none; margin-top: 2px; accent-color: var(--brown); }
    .bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,253,250,.97); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
    .bar .in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .total { flex: 1; } .total b { font-family: 'Frank Ruhl Libre', serif; font-size: 1.5rem; color: var(--brown); display: block; line-height: 1.1; } .total span { font-size: .8rem; color: var(--muted); }
    .btn { background: var(--brown); color: var(--cream); border: 0; border-radius: 14px; padding: 14px 22px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.ghost { background: var(--paper); color: var(--brown); border: 1px solid var(--line-2); }
    .btn.wa { background: #2f7d4f; }
    .err { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 10px 14px; margin: 12px 0; font-weight: 600; }
    .empty { text-align: center; color: var(--muted); padding: 50px 16px; }
    .done { text-align: center; padding: 26px 18px; }
    .done .ic { width: 64px; height: 64px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; }
    .sum { text-align: right; margin: 16px 0; } .sum div { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed var(--line); }
    .sum div:last-child { border: 0; font-weight: 700; color: var(--brown); }
    .loader { width: 34px; height: 34px; border: 3px solid var(--sand); border-top-color: var(--brown); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 60px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .missing { outline: 2px solid var(--bad); outline-offset: 2px; border-radius: 12px; }
    .paybox-note { background: var(--sand-2); border-radius: 12px; padding: 10px 14px; font-size: .92rem; color: var(--brown); margin-bottom: 12px; }
    .pay-step { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 6px; }
    .pay-step .due { font-family: 'Frank Ruhl Libre', serif; font-size: 2.2rem; color: var(--brown); }
    .pay-opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: right; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-top: 10px; background: var(--paper); }
    .paid-ok { background: var(--ok-bg); color: var(--ok); border-radius: 12px; padding: 12px; font-weight: 600; }
    footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 30px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><img src="assets/logo.png" alt="על הגשר — מאפים, מתוקים ומעבר"></header>
    <main id="app"><div class="loader" role="status" aria-label="טוען"></div></main>
  </div>
  <script src="js/order.js?v=202610252120"></script>
</body>
</html>
